server:
  port: 8080

spring:
  application:
    name: second-hand-backend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/second_hand
    username: postgres
    password: "123456"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# ============ AI 模块配置 ============
ai:
  # 大模型服务是否启用（本机无网络/联调阶段置 false 走 Mock 实现）
  enabled: false
  llm:
    base-url: https://api.example.com/v1
    api-key: "${LLM_API_KEY:sk-xxxx}"
    model: gpt-4o-mini
    timeout-ms: 15000
  # AI 辅助审核开关：true=发布进入审核中(4)，false=直接上架(1)
  audit-on-publish: true

# 跨域允许的来源（前端开发服务器地址，按团队实际修改）
cors:
  allowed-origins:
    - http://localhost:5173
    - http://localhost:3000
    - http://127.0.0.1:5173
